name: Build ESP32 NEXUS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.esp32nexus --project-name esp32_nexus .
          fi
      - name: Add Android permissions
        shell: python
        run: |
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n'''
          if 'BLUETOOTH_SCAN' not in s:
            s=s.replace('>', '>'+perms, 1)
          s=s.replace('android:label="esp32_nexus"', 'android:label="ESP32 NEXUS"')
          p.write_text(s)
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-NEXUS-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  firmware:
    name: Build ESP32-C3 Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build firmware
        run: pio run -e esp32-c3-supermini
      - name: Package flash files
        run: |
          mkdir -p release
          cp .pio/build/esp32-c3-supermini/firmware.bin release/ESP32-NEXUS-firmware.bin
          cp .pio/build/esp32-c3-supermini/bootloader.bin release/ESP32-NEXUS-bootloader.bin || true
          cp .pio/build/esp32-c3-supermini/partitions.bin release/ESP32-NEXUS-partitions.bin || true
          cp firmware/firmware.ino release/ESP32-NEXUS-firmware.ino
          zip -j release/ESP32-NEXUS-FLASH-PACK.zip release/*
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-NEXUS-Firmware
          path: release/*
